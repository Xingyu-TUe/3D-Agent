# 快速冒烟训练（演示数据）
data_root: "data/dataset"
output_dir: "outputs/demo_fast"
auto_split_val: true
val_ratio: 0.15
seed: 42
image_size: 224
batch_size: 16
num_workers: 0
epochs: 8
learning_rate: 0.001
weight_decay: 0.0001
head_only_epochs: 2
fine_tune_lr: 0.0001
early_stop_patience: 5
save_best_only: true
augment:
  horizontal_flip: true
  rotation_degrees: 10
  color_jitter: 0.05
